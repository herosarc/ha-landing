name: Publish to gh-pages

# GitHub Pages must be enabled once by a repo admin:
# Settings -> Pages -> Source: Deploy from a branch -> gh-pages / (root).
# Site creation via API is not possible with the tokens available here
# (returns "Resource not accessible by integration"). After that one click,
# every push to main republishes the site automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish site/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
